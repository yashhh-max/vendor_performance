[build]
  publish = "frontend/public"

# Proxy API requests to permanent cloud-hosted backend on Vercel
[[redirects]]
  from = "/api/*"
  to = "https://vendorperformance.vercel.app/api/:splat"
  status = 200
  force = true

# Single Page App routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
